[project]
name = "finanze-parser"
version = "0.1.0"
description = "Parse monthly bank/brokerage statements into rows for the Finanze Google Sheet"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "pdfplumber>=0.11",
    "pyyaml>=6.0",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
finanze = "finanze.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "mutmut>=3.0",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finanze = ["storage/migrations/*.sql", "web/templates/*.html", "web/static/*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "PL",       # pylint
    "RUF",      # ruff-specific
    "S",        # bandit (security)
    "DTZ",      # naive datetimes
    "PT",       # pytest style
    "ANN",      # annotations
    "FURB",     # refurb
    "T20",      # no print()
    "ERA",      # no commented-out code
]
ignore = [
    "PLR2004",  # magic values are fine in parsers/specs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR0913"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["pdfplumber", "pdfplumber.*"]
ignore_missing_imports = true

# -------------------------------------------------------------- pytest
[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]

# ------------------------------------------------------------ coverage
[tool.coverage.run]
source = ["finanze"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ------------------------------------------------------------- mutmut
[tool.mutmut]
paths_to_mutate = ["src/finanze/validation.py"]
tests_dir = ["tests/"]
