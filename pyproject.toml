[project]
name = "finanze-parser"
version = "0.1.0"
description = "Parse monthly bank/brokerage statements into the Finanze Google Sheet"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
