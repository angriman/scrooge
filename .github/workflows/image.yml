# The web app's image for the NAS (Synology DS725+, x86-64), built from the Dockerfile and
# pushed to GitHub's registry, private like the repository:
#   ghcr.io/<owner>/finanze:<tag> and :latest, on a tag `v*` once `make check` passes.
# Run by hand (Actions > image > Run workflow) on a tag, it does the same; on a branch, it
# pushes only `sha-<commit>` and leaves `latest` where it is. deploy/README.md: pulling it.
#
# Third-party actions are pinned by tag for now: pin each to the full commit SHA of that
# release (with the version in a comment) before the first push.

name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5 # TODO pin to SHA
        with:
          persist-credentials: false

      # The registry takes lower-case names only; the owner's may not be.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/finanze" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5 # TODO pin to SHA
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=finanze
            org.opencontainers.image.description=The finanze web app (finanze serve)

      - uses: docker/setup-buildx-action@v3 # TODO pin to SHA

      - uses: docker/login-action@v3 # TODO pin to SHA
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6 # TODO pin to SHA
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
