# The README's coverage badge: once check.yml passes on a push to main, the total it measured
# is written as a shields.io endpoint, coverage.json, to the branch `badges`, which holds
# nothing else (one commit, replaced each time). Not in check.yml, which image.yml calls with
# read-only permissions.
#
# Third-party actions are pinned to the full commit SHA of a release, its version beside it.

name: coverage

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: coverage
  cancel-in-progress: false

jobs:
  badge:
    # A push to main only: never a pull request's run, whose artifact a fork could write.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # the artifact of the check run
      contents: write # the branch `badges`
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-total
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Write coverage.json to the branch badges
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Runs on main may finish out of order: only main's newest commit writes the badge.
          head=$(gh api "repos/${REPO}/commits/main" --jq .sha)
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "main is at $head now, not $HEAD_SHA: the badge is left to its run"
            exit 0
          fi
          total=$(tr -d '[:space:]' < coverage-total.txt)
          if ! printf '%s' "$total" | grep -Eq '^[0-9]{1,3}(\.[0-9]+)?$'; then
            echo "not a coverage total: $total" >&2
            exit 1
          fi
          # Green above the floor of 90% that `make check` holds, brighter from 95%.
          color=$(awk -v t="$total" 'BEGIN { print (t >= 95 ? "brightgreen" : t >= 90 ? "green" : "red") }')
          mkdir badges && cd badges
          printf '{"schemaVersion": 1, "label": "coverage", "message": "%s%%", "color": "%s"}\n' \
            "$total" "$color" > coverage.json
          git init -q -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Coverage ${total}%"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:badges
