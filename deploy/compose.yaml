# The app on the NAS (Synology Container Manager: Project), the one place the data lives and
# changes. Steps: README.md, here.
#
# Lives on the NAS next to the data folder. The image is built by GitHub
# (.github/workflows/image.yml) and pulled from its registry. Three things to adapt, all
# marked PLACEHOLDER. No password here or in the image: its digest is in scrooge.yaml, in
# the data folder.

services:
  scrooge:
    # PLACEHOLDER: the owner of the repository, in lower case. `latest` is the newest tag v*;
    # a tag (`:v1.2.3`) keeps that version until this line changes.
    image: ghcr.io/<owner>/scrooge:latest
    container_name: scrooge

    # PLACEHOLDER: the user and group of the NAS that own the data folder, as numbers
    # (`id <user>` on the NAS). Not root. The app writes there as this user: the database,
    # its backups, originals/, rules and categories added from the pages.
    user: "1026:100"

    volumes:
      # PLACEHOLDER (left of the colon): the data folder, read and written. The folder, not
      # its files, so that SQLite can keep its journal next to the database.
      - /volume1/docker/scrooge/data:/data

    ports:
      # Every address of the NAS, the tailnet's among them. Put an address in front
      # ("100.x.y.z:8765:8765") to answer on that one alone.
      - "8765:8765"

    restart: unless-stopped

    # The app writes nowhere but /data: not in its own file system, not as anyone more than
    # it is. Uploads and Tesseract's work files go to /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
