# Your setup. `scrooge` finds it by itself while it is the only one in users/ and there is no
# scrooge.yaml in the folder the commands run in; with `--user <name>` (or SCROOGE_USER)
# otherwise. Relative paths are relative to the folder the commands run in, the one users/
# is in. `scrooge init` wrote it from src/scrooge/starter/; it is yours now.

# The database, made on the first import. Its backups/ and originals/ (a copy of every
# statement imported) are kept next to it.
database: $home/scrooge.db

# The rules (the first is the one both people share; categories.yaml is kept next to it) and
# the instruments.
rules: [$home/rules.yaml]
instruments: $home/instruments.yaml

# Whose statements `scrooge import` reads, unless --owner names the other person.
owner: $owner

# How each person appears as a counterparty on statements: the name as printed, and IBANs,
# each a regular expression matched ignoring case. Money between the two is marked, so that
# the view of both together leaves it out.
owners:
$owners

# The category of every expense and income no rule matches, so that every statement can be
# committed without choosing categories: net worth needs none. Rows that are no expense or
# income (a deposit at a broker) still go to review. To track expenses, delete this line and
# answer `scrooge import --review`, which asks once per unknown merchant and saves rules.
unmatched: Uncategorized

# What the pages show figures in until another is chosen there: EUR, CHF, USD, GBP or JPY.
currency: $currency

# The currencies the month-end table of net worth shows side by side; CHF, USD and EUR
# without it.
# currencies: [CHF, USD, EUR]

# A second account at one bank or broker gets a name of its own from its number (IBKR) or
# its IBAN (Migros): "<label> <last word of the usual name>", e.g. "Risparmio Migros".
# account_labels:
#   U7654321: IBKR 2
#   CH0000000000000000000: Risparmio

# The accounts whose money cannot be reached, as the pages name them (a rent deposit): net
# worth sets them apart as frozen, with Pillar 2 and Pillar 3a, which are frozen without it.
# A bare name is every account so called; {<owner>: <name>} is that person's alone.
# frozen: [Deposito affitto, {Anna: Risparmio}]

# To reach the pages from other devices, with a password (`scrooge password` prints it):
# serve:
#   host: 0.0.0.0
#   names: [nas.example.ts.net]
#   password: scrypt$$...  # pragma: allowlist secret
