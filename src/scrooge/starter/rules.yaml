# Your rules: description -> category (the categories are in src/scrooge/categories.py).
# `scrooge init` wrote this file from the starter in src/scrooge/starter/; it is yours now, in
# your git-ignored users/<name>/ folder, since rules that name shops, people or an employer
# are personal.
#
# `match` is a case-insensitive regular expression searched in the transaction's description and
# counterparty. The first matching rule wins, so put the specific rules (a shop, a person) first.
# Optional keys: `kind` (expense, income, ...), `account` (apply only to that account) and
# `direction` (in | out). One person's rules for rows naming either person go in
# `rules.<owner>.yaml` beside it, read before this file. `--review` and the import page add
# rules here. Transactions no rule matches are left for review.
rules:
  # --- Transport
  - {match: 'CARBURANTI|TANKSTELLE|DISTRIBUTORE', category: Fuel}
  - {match: 'PARKING|PARCHEGGIO|PARKHAUS|AUTOSTRAD|PEDAGGIO', category: Parking and tolls}

  # --- Eating out
  - {match: 'RESTAURANT|RISTORANTE|TRATTORIA|OSTERIA|PIZZERIA|\bPIZZA|RAMEN|SUSHI|\bGRILL\b', category: "Eating out"}
  - {match: 'GELAT|\bCAF[EÉ]\b|CAFF[EÈ]|\bKAFI\b|KAFFEE|COFFEE|\bBAR\b|BISTRO|BAKERY|B[AÄ]CKEREI|CONFISERIE|CONFISEUR', category: "Eating out"}

  # --- Food
  - {match: 'SUPERMARKET|SUPERMERCATO|HOFLADEN', category: Groceries}

  # --- Home, health, personal care
  - {match: 'ELEKTRIZIT[AÄ]TSWERK', category: Utilities}
  - {match: 'KRANKEN-?VERSICHERUNG', category: Health insurance}
  - {match: 'APOTHEKE|PHARMACIE|FARMACIA|DROGERIE', category: Doctor/Pharmacy}
  - {match: 'ZAHNARZT|DENTIST', category: Dentist}
  - {match: 'BARBIERE|BARBER|COIFFEUR', category: Barber}

  # --- Education, travel
  - {match: 'LIBRERIA|BUCHHANDLUNG', category: Books}
  - {match: '\bHOTELS?\b|HOSTEL', category: Accommodation}
  - {match: 'BERGBAHNEN|LUFTSEILBAHN|\bKINO\b|CINEMA|MUSEUM|MUSEO', category: Activities}

  # --- Banking
  - {match: 'Metal( repricing \d+)? plan fee', category: Revolut Metal}
  - {match: 'Spese per traffico pagamenti|SPESE DI GESTIONE|Withdrawal Fee', category: Fees}

  # --- Donations, taxes and paperwork (after Utilities: "Elektrizitätswerk der Stadt ...")
  - {match: 'STIFTUNG', category: Donations}
  - {match: 'STEUERAMT|AGENZIA DELLE ENTRATE', category: Taxes}
  - {match: 'CONSOLATO|STADTPOLIZEI', category: Paperwork}
